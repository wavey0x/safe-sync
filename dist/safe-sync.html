<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Safe Sync</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50' y='.9em' font-size='90' text-anchor='middle'>✍️</text></svg>">
<style>:root {
  --bg: #f6f7f9; --card: #fff; --fg: #15181d; --muted: #6b7280; --line: #e3e6ea; --accent: #0f7b5f; --accent-fg: #fff;
  --good: #0f7b5f; --bad: #c0362c; --warn: #a15c00; --chip: #eef1f4; --active: #eaf6f1;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --tip-bg: #1d2127; --tip-fg: #f1f3f5; --tip-line: transparent;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0f1114; --card: #171a1f; --fg: #e6e8eb; --muted: #8b93a1; --line: #2a2f37; --accent: #3ccf9f; --accent-fg: #06261c;
    --good: #3ccf9f; --bad: #ff7a6e; --warn: #f0b45a; --chip: #232830; --active: #13261f;
    --tip-bg: #262b33; --tip-fg: #e6e8eb; --tip-line: #363d47; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; }
header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--card); }
.brand { font-weight: 700; font-size: 17px; color: var(--fg); text-decoration: none; letter-spacing: -0.01em; }
main { max-width: 1040px; margin: 0 auto; padding: 16px; display: grid; gap: 14px; }
main.narrow { max-width: 760px; }

/* Stages */
.stages { display: flex; align-items: center; gap: 8px; padding: 4px 2px; }
.stage { border: 0; background: transparent; padding: 4px 2px; color: var(--muted); gap: 8px; }
.stage-n { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--line); font-size: 12px; }
.stage.on, .stage.done { color: var(--fg); }
.stage.on .stage-n { background: var(--accent); color: var(--accent-fg); box-shadow: none; }
.stage.done .stage-n { color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); }
.stage:disabled { opacity: .5; }
.stage-line { flex: 1; height: 1px; background: var(--line); } .stage-line.done { background: var(--accent); }
.footer { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-top: 12px; border-top: 1px solid var(--line); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.sticky { position: sticky; top: 8px; z-index: 2; box-shadow: 0 4px 16px rgba(0,0,0,.06); }
h2, h3 { margin: 0; font-size: 17px; } h3 { font-size: 15px; } p { margin: 0; }
a { color: var(--accent); }
label { display: grid; gap: 4px; } label > span { font-weight: 600; }
small, .small { font-size: 12px; } .muted { color: var(--muted); } .good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); }
.mono, code, textarea { font-family: var(--mono); font-size: 12.5px; }
.wrap { word-break: break-all; }
code { background: var(--chip); padding: 0 4px; border-radius: 4px; }
input, textarea { width: 100%; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; font: inherit; }
textarea { resize: vertical; font-family: var(--mono); }
input.title { font-size: 16px; font-weight: 600; }
input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.check { display: flex; align-items: center; gap: 6px; } .check input { width: auto; }
button, .button { border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 7px; padding: 7px 14px; font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
button img { width: 18px; height: 18px; }
button:hover:not(:disabled), .button:hover { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.bad-btn { border-color: var(--bad); color: var(--bad); }
.errors { color: var(--bad); display: grid; gap: 2px; }
.notice { color: var(--warn); }
.summary { font-size: 15px; font-weight: 600; display: flex; flex-wrap: wrap; gap: 4px 16px; }
.stack { display: grid; gap: 4px; justify-items: start; }
.spaced { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; } .aside { margin-left: 10px; } /* space, not dots, between parts */
.nowrap { white-space: nowrap; }
.chip + .chip { margin-left: 4px; }
.chip { display: inline-block; background: var(--chip); border-radius: 5px; padding: 0 6px; font-size: 12px; font-family: var(--mono); white-space: nowrap; }
/* A chain's logo before its name, with a faint ring so dark logos keep their edge on a dark chip */
.logo { width: 14px; height: 14px; border-radius: 50%; vertical-align: -3px; margin-right: 4px; box-shadow: 0 0 0 1px color-mix(in srgb, var(--fg) 10%, transparent); }
/* A Safe's signatures, "2/5", over one dash per signature its threshold needs (--t); outlined once proposed */
.count { position: relative; display: inline-block; min-width: min(calc(var(--t) * 6px + 12px), 96px); text-align: center; background: var(--chip); border-radius: 5px; padding: 0 7px 4px; font-size: 12px; font-family: var(--mono); white-space: nowrap; }
.count.proposed { box-shadow: inset 0 0 0 1px var(--accent); }
a.count { color: inherit; text-decoration: none; } a.count:hover { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--chip)); }
.dashes { position: absolute; left: 6px; right: 6px; bottom: 2px; height: 2px; display: flex; gap: 2px; }
.dashes i { flex: 1; border-radius: 1px; background: color-mix(in srgb, var(--muted) 35%, transparent); } .dashes i.on { background: var(--accent); }
.tag { font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; color: var(--muted); }
.label { color: var(--accent); font-size: 0.9em; font-style: italic; } /* a name for the address before it: (winthorpe.eth) */
.fingerprint { font-family: var(--mono); font-weight: 700; background: var(--chip); border-radius: 6px; padding: 3px 8px; }

/* The change, in plain language */
.change { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; display: grid; gap: 6px; }
.acts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; align-items: baseline; font-size: 15px; }
.acts .verb { color: var(--muted); font-size: 13px; } .acts .in { color: var(--good); } .acts .out { color: var(--bad); }
.kept { display: flex; flex-wrap: wrap; gap: 4px 14px; padding-top: 6px; font-size: 13px; }
details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
.actions-detail { display: grid; gap: 6px; padding: 4px 0 10px; }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.fn { font-family: var(--mono); font-weight: 600; }
.args { display: grid; gap: 1px; padding-left: 4px; margin-top: 2px; font-size: 12.5px; }

/* Compose: Safes, owners, mode */
.found { display: grid; gap: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.pick { font-family: var(--mono); font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 5px; color: var(--muted); }
.pick.on { background: var(--active); border-color: var(--accent); color: var(--fg); }
.pick.drift { border-color: var(--warn); box-shadow: inset 0 0 0 1px var(--warn); }
.pick.unreachable { color: var(--warn); border-style: dashed; }
.pick:not(.on) .logo { filter: grayscale(1); opacity: .5; } /* a chain left out */
.swap { display: flex; gap: 8px; align-items: center; min-width: 0; } .swap input { flex: 1; min-width: 0; }
.owners { display: grid; gap: 4px; }
.owner .add { grid-column: span 2; }
.owner { display: grid; grid-template-columns: minmax(110px, max-content) minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 4px 0; border-bottom: 1px solid var(--line); }
.owner input { padding: 5px 8px; }
.owner .actions { display: flex; gap: 2px; }
.owner .actions button { padding: 4px 8px; font-weight: 500; }
.gone { text-decoration: line-through; color: var(--muted); }
/* A proposer: its label, and below it the chains it's missing from (amber outline, like a drifted chain) or the few it's
   on. On a phone its actions get a line of their own. */
.proposer { grid-template-areas: 'addr who act' '. where where'; row-gap: 2px; }
.proposer .who-addr { grid-area: addr; } .proposer .who { grid-area: who; min-width: 0; } .proposer .actions { grid-area: act; justify-content: flex-end; }
.where { grid-area: where; display: flex; flex-wrap: wrap; align-items: center; gap: 3px 4px; padding-bottom: 2px; } .where .chip + .chip { margin-left: 0; }
.chip.missing { background: none; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--warn) 70%, transparent); }
.swap input.label-input { flex: 0 1 32%; font-family: inherit; }
.owner.adding { border-bottom: 0; } /* the footer's rule follows */
.p-safes { display: grid; gap: 6px; padding-bottom: 12px; border-bottom: 1px solid var(--line); } /* the proposers page's Safes */
.chip.off { opacity: .55; } .chip.off .logo { filter: grayscale(1); } /* a chain without a Safe service: no proposers there */
.chip .spin { width: 9px; height: 9px; border-width: 1.5px; vertical-align: -1px; }
/* A quiet way somewhere else, under a step's main button */
.side-link { justify-self: end; margin-top: -6px; font-size: 12.5px; color: var(--muted); text-decoration: none; }
.side-link:hover { color: var(--accent); }
@media (max-width: 520px) {
  .proposer { grid-template-columns: max-content minmax(0, 1fr); grid-template-areas: 'addr who' '. where' '. act'; }
  .proposer .actions { justify-content: flex-start; margin-left: -8px; }
}
/* An address: short form, then a quiet copy button that turns into a drawn check */
.addr { display: inline-flex; align-items: center; gap: 1px; white-space: nowrap; vertical-align: middle; }
.addr a { color: inherit; text-decoration: underline dotted var(--line); text-underline-offset: 3px; }
.addr a:hover { color: var(--accent); text-decoration-color: currentColor; }
.copy { padding: 2px; border: 0; display: inline-grid; place-items: center; color: color-mix(in srgb, var(--muted) 70%, transparent); vertical-align: middle; }
.copy:hover:not(:disabled) { border-color: transparent; } .copy:not(.ok, .failed):hover { color: var(--fg); }
.copy svg { grid-area: 1 / 1; width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.copy .check-icon, .copy.ok .copy-icon { visibility: hidden; } .copy.ok .check-icon { visibility: visible; }
.copy.ok { color: var(--good); } .copy.failed { color: var(--bad); }
.copy.ok .check-icon path { stroke-dasharray: 14; stroke-dashoffset: 14; animation: draw .3s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.segs { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; padding: 2px; gap: 2px; }
.seg { border: 0; background: transparent; color: var(--muted); padding: 6px 12px; }
.seg.on { background: var(--active); color: var(--fg); }
.select { position: relative; display: inline-flex; }
.select select { appearance: none; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 7px; padding: 5px 30px 5px 12px; font: inherit; font-weight: 600; cursor: pointer; }
.select select:hover { border-color: var(--accent); } .select select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.select::after { content: ''; position: absolute; right: 12px; top: calc(50% - 5px); width: 6px; height: 6px; border: solid var(--muted); border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); pointer-events: none; }
.reference { display: grid; gap: 4px; }
.reference .select, .reference select { width: 100%; min-width: 0; }
/* A review row's nonce choice: the nonce in a chip, with its select laid invisibly over it (nonceSelect) */
.pick-nonce { position: relative; display: inline-block; background: var(--chip); border-radius: 5px; padding: 0 16px 0 6px; font-size: 12px; font-family: var(--mono); white-space: nowrap; cursor: pointer; }
.pick-nonce::after { content: ''; position: absolute; right: 6px; top: calc(50% - 4px); width: 4px; height: 4px; border: solid var(--muted); border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); pointer-events: none; }
.pick-nonce select { position: absolute; inset: 0; width: 100%; opacity: 0; cursor: pointer; font: inherit; }
.pick-nonce:hover { box-shadow: inset 0 0 0 1px var(--accent); } .pick-nonce:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
.pick-nonce.warn, .pick-nonce.warn:hover { box-shadow: inset 0 0 0 1px var(--warn); }
.queue-bar { flex-wrap: wrap; } .queue-bar .grow { flex: 1 0 auto; }
.queued { display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 4px 0 2px; }
.retry { padding: 0 6px; }
pre { margin: 6px 0 0; white-space: pre-wrap; }
/* A row's chevron: a button in its own right, lit up while the row is hovered, turned down when open */
.disclose { padding: 2px; border-radius: 6px; vertical-align: middle; }
.disclose svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform .15s; }
.disclose[aria-expanded=true] svg { transform: rotate(90deg); }
tr:hover .disclose, .disclose[aria-expanded=true] { color: var(--fg); background: var(--chip); }
/* A row's own refresh: shown on hover or focus (always on touch screens), gone while it can't be used */
.row-actions { white-space: nowrap; text-align: right; }
button.exec { padding: 1px 10px; font-size: 13px; color: var(--good); }
.refresh { padding: 2px 6px; opacity: 0; } .refresh:hover:not(:disabled) { color: var(--fg); }
tr:hover .refresh, .refresh:focus-visible { opacity: 1; }
.refresh:disabled { visibility: hidden; }
@media (hover: none) { .refresh { opacity: 1; } }

/* Progress */
.bar { height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--good); transition: width .4s ease; }
.done-msg { color: var(--good); font-weight: 600; font-size: 15px; }
.current { border: 1px solid var(--accent); border-radius: 8px; padding: 8px 12px; display: grid; gap: 2px; background: var(--active); min-width: 0; }
.hashes { font-size: 12.5px; display: flex; gap: 0 8px; flex-wrap: wrap; min-width: 0; } .hashes .muted { min-width: 96px; } .hashes .mono { word-break: break-all; min-width: 0; }

/* Checklist marks */
.ico { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; font-size: 12px; font-weight: 800; line-height: 1; }
.ico.done { background: var(--good); color: var(--accent-fg); animation: pop .35s ease-out; }
.ico.todo { box-shadow: inset 0 0 0 1.5px var(--muted); }
.ico.todo.quiet { box-shadow: inset 0 0 0 1.5px var(--line); }
.ico.idle { color: var(--muted); }
.ico.warn { background: var(--bad); color: #fff; }
.ico.now { border: 2px solid var(--accent); border-top-color: transparent; animation: spin .8s linear infinite; }
.ico.load { width: 14px; height: 14px; margin: 3px; border: 1.5px solid var(--line); border-top-color: var(--muted); animation: spin 1s linear infinite; }
.ico.pending { border: 1.5px dashed var(--muted); }
.ico.pending.failed { border-color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
@keyframes pop { 0% { transform: scale(.3); } 70% { transform: scale(1.2); } 100% { transform: scale(1); } }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .ico, .bar i, .spin { animation: none !important; transition: none; } .copy.ok .check-icon path { animation: none; stroke-dasharray: none; } }

/* Waiting: a spinner on the blocked button, or a quiet line for background work */
.spin { display: inline-block; flex: none; width: 12px; height: 12px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
.busy { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.busy .spin { width: 10px; height: 10px; border-width: 1.5px; }
button:disabled:has(.spin) { opacity: .75; cursor: progress; }
/* Icon-only buttons: the Settings ✕ and the header's gear */
.close, .icon-btn { padding: 6px; } :is(.close, .icon-btn):hover:not(:disabled) { color: var(--fg); }
.close svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; }
.icon-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

/* Tooltips: one element, placed by app.ts above (or below) whatever [data-tip] is hovered or focused */
.tip { position: fixed; left: 0; top: 0; z-index: 30; max-width: min(300px, calc(100vw - 16px)); padding: 6px 10px; border-radius: 8px;
  background: var(--tip-bg); color: var(--tip-fg); border: 1px solid var(--tip-line); font: 500 12px/1.45 system-ui, -apple-system, Segoe UI, sans-serif;
  overflow-wrap: anywhere; box-shadow: 0 6px 20px rgba(0,0,0,.22); pointer-events: none; visibility: hidden; }
.tip.on { visibility: visible; }
/* Addresses and hashes: monospace, in full on one line when the viewport allows */
.tip.mono { max-width: calc(100vw - 16px); font: 500 11.5px/1.45 var(--mono); letter-spacing: -.01em; }
/* A small pointer toward the element, drawn as a rotated square in the tooltip's own colours */
.tip::after { content: ''; position: absolute; left: var(--pointer, 50%); width: 8px; height: 8px; background: inherit;
  border: inherit; border-width: 0 1px 1px 0; transform: translateX(-50%) rotate(45deg); }
.tip[data-side=above]::after { bottom: -5px; }
.tip[data-side=below]::after { top: -5px; transform: translateX(-50%) rotate(225deg); }

/* Tables */
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
@media (max-width: 520px) { td { padding-left: 3px; padding-right: 3px; } td .chip { padding: 0 4px; } td .logo { margin-right: 3px; } } /* every column fits on a phone, chevron included */
td > .mono, td > .chip { white-space: nowrap; }
td.ico-cell { width: 28px; padding-right: 0; }
tr.done > td:not(.ico-cell) { opacity: .55; } /* executed: out of the way of what's left */
td.grow-cell { width: 100%; }
.list td { vertical-align: middle; }
tr.click { cursor: pointer; } tr.click:hover td { background: color-mix(in srgb, var(--accent) 5%, transparent); }
tr.active td { background: var(--active); }
tr.details td { background: var(--bg); cursor: auto; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; font-size: 12.5px; } .kv > span:nth-child(odd) { color: var(--muted); }
.actions-detail + .kv { border-top: 1px solid var(--line); padding-top: 10px; }
.fields { display: flex; flex-wrap: wrap; gap: 0 14px; }

.linkbox { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; } .linkbox .small { grid-column: 1 / -1; }

/* Settings */
.endpoint { display: grid; gap: 4px; padding: 6px 0; }
.pick.text { font-family: inherit; }
.badge { font-size: 11px; color: var(--accent); border: 1px solid currentColor; border-radius: 99px; padding: 1px 7px; white-space: nowrap; }

/* Wallet: one button in the header, with a small menu */
.wallet { position: relative; display: inline-flex; }
.account { gap: 8px; font-weight: 500; }
.account .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
.menu { position: absolute; top: calc(100% + 6px); right: 0; z-index: 20; min-width: 220px; display: grid; gap: 4px; padding: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
.menu > button { justify-content: flex-start; }
.wallet.in-card .menu { left: 0; right: auto; }
/* Connect on a signing link: the header's button, with a light running around its border */
@property --glint { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
.glint { position: relative; }
.glint::before { content: ''; position: absolute; inset: -1px; padding: 1px; border-radius: inherit; pointer-events: none;
  background: conic-gradient(from var(--glint), transparent 55%, var(--accent) 90%, transparent 97%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); mask-composite: exclude;
  animation: glint 3s linear infinite; }
@keyframes glint { to { --glint: 360deg; } }
@media (prefers-reduced-motion: reduce) { .glint::before { display: none; } .glint { border-color: var(--accent); } }
</style>
</head>
