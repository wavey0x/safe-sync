<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Safe Sync</title>
<style>:root {
  --bg: #f6f7f9; --card: #fff; --fg: #15181d; --muted: #6b7280; --line: #e3e6ea; --accent: #0f7b5f; --accent-fg: #fff;
  --good: #0f7b5f; --bad: #c0362c; --warn: #a15c00; --chip: #eef1f4; --active: #eaf6f1;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0f1114; --card: #171a1f; --fg: #e6e8eb; --muted: #8b93a1; --line: #2a2f37; --accent: #3ccf9f; --accent-fg: #06261c;
    --good: #3ccf9f; --bad: #ff7a6e; --warn: #f0b45a; --chip: #232830; --active: #13261f; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; }
header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--card); }
.brand { font-weight: 700; font-size: 17px; color: var(--fg); text-decoration: none; letter-spacing: -0.01em; }
main { max-width: 1040px; margin: 0 auto; padding: 16px; display: grid; gap: 14px; }
main.narrow { max-width: 760px; }

/* Stages */
.stages { display: flex; align-items: center; gap: 8px; padding: 4px 2px; }
.stage { border: 0; background: transparent; padding: 4px 2px; color: var(--muted); gap: 8px; }
.stage-n { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--line); font-size: 12px; }
.stage.on, .stage.done { color: var(--fg); }
.stage.on .stage-n { background: var(--accent); color: var(--accent-fg); box-shadow: none; }
.stage.done .stage-n { color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); }
.stage:disabled { opacity: .5; }
.stage-line { flex: 1; height: 1px; background: var(--line); } .stage-line.done { background: var(--accent); }
.footer { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-top: 12px; border-top: 1px solid var(--line); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.sticky { position: sticky; top: 8px; z-index: 2; box-shadow: 0 4px 16px rgba(0,0,0,.06); }
h2, h3 { margin: 0; font-size: 17px; } h3 { font-size: 15px; } p { margin: 0; }
a { color: var(--accent); }
label { display: grid; gap: 4px; } label > span { font-weight: 600; }
small, .small { font-size: 12px; } .muted { color: var(--muted); } .good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); }
.mono, code, textarea { font-family: var(--mono); font-size: 12.5px; }
.wrap { word-break: break-all; }
code { background: var(--chip); padding: 0 4px; border-radius: 4px; }
input, textarea { width: 100%; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; font: inherit; }
textarea { resize: vertical; font-family: var(--mono); }
input.title { font-size: 16px; font-weight: 600; }
input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.check { display: flex; align-items: center; gap: 6px; } .check input { width: auto; }
button, .button { border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 7px; padding: 7px 14px; font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
button img { width: 18px; height: 18px; }
button:hover:not(:disabled), .button:hover { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.bad-btn { border-color: var(--bad); color: var(--bad); }
.errors { color: var(--bad); display: grid; gap: 2px; }
.notice { color: var(--warn); }
.summary { font-size: 15px; font-weight: 600; }
.nowrap { white-space: nowrap; }
.chip + .chip { margin-left: 4px; }
.chip { display: inline-block; background: var(--chip); border-radius: 5px; padding: 0 6px; font-size: 12px; font-family: var(--mono); white-space: nowrap; }
.tag { font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; color: var(--muted); }
.label { color: var(--accent); font-size: 12px; }
.fingerprint { font-family: var(--mono); font-weight: 700; background: var(--chip); border-radius: 6px; padding: 3px 8px; }

/* The change, in plain language */
.change { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; display: grid; gap: 6px; }
.acts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; align-items: baseline; font-size: 15px; }
.acts .verb { color: var(--muted); font-size: 13px; } .acts .in { color: var(--good); } .acts .out { color: var(--bad); }
.kept { display: flex; flex-wrap: wrap; gap: 4px 14px; padding-top: 6px; font-size: 13px; }
details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
.actions-detail { display: grid; gap: 6px; padding: 4px 0 10px; }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.fn { font-family: var(--mono); font-weight: 600; }
.args { display: grid; gap: 1px; padding-left: 4px; margin-top: 2px; font-size: 12.5px; }

/* Compose: Safes, owners, mode */
.found { display: grid; gap: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.pick { font-family: var(--mono); font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 5px; color: var(--muted); }
.pick.on { background: var(--active); border-color: var(--accent); color: var(--fg); }
.pick.drift { border-color: var(--warn); box-shadow: inset 0 0 0 1px var(--warn); }
.pick.unreachable { color: var(--warn); border-style: dashed; }
.swap { display: flex; gap: 8px; align-items: center; min-width: 0; } .swap input { flex: 1; min-width: 0; }
.owners { display: grid; gap: 4px; }
.owner .add { grid-column: span 2; }
.owner { display: grid; grid-template-columns: minmax(110px, max-content) minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 4px 0; border-bottom: 1px solid var(--line); }
.owner input { padding: 5px 8px; }
.owner .actions { display: flex; gap: 2px; }
.owner .actions button { padding: 4px 8px; font-weight: 500; }
.gone { text-decoration: line-through; color: var(--muted); }
.safe-addr { display: inline-flex; align-items: center; gap: 2px; white-space: nowrap; }
.safe-addr a { color: inherit; text-decoration: underline dotted var(--line); text-underline-offset: 3px; }
.safe-addr a:hover { color: var(--accent); text-decoration-color: currentColor; }
.copy { padding: 3px; display: inline-grid; place-items: center; }
.copy:hover:not(:disabled) { border-color: transparent; } .copy:not(.ok, .failed):hover { color: var(--fg); }
.copy svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.copy.ok { color: var(--good); } .copy.failed { color: var(--bad); }
.copy.ok path { stroke-dasharray: 14; stroke-dashoffset: 14; animation: draw .3s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.segs { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; padding: 2px; gap: 2px; }
.seg { border: 0; background: transparent; color: var(--muted); padding: 6px 12px; }
.seg.on { background: var(--active); color: var(--fg); }
input.num { width: 64px; padding: 5px 8px; text-align: center; }
pre { margin: 6px 0 0; white-space: pre-wrap; }
.disclose { padding: 2px 8px; }

/* Progress */
.bar { height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--good); transition: width .4s ease; }
.done-msg { color: var(--good); font-weight: 600; font-size: 15px; }
.current { border: 1px solid var(--accent); border-radius: 8px; padding: 8px 12px; display: grid; gap: 2px; background: var(--active); min-width: 0; }
.hashes { font-size: 12.5px; display: flex; gap: 0 8px; flex-wrap: wrap; min-width: 0; } .hashes .muted { min-width: 96px; } .hashes .mono { word-break: break-all; min-width: 0; }

/* Checklist marks */
.ico { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; font-size: 12px; font-weight: 800; line-height: 1; }
.ico.done { background: var(--good); color: var(--accent-fg); animation: pop .35s ease-out; }
.ico.todo { box-shadow: inset 0 0 0 1.5px var(--muted); }
.ico.todo.quiet { box-shadow: inset 0 0 0 1.5px var(--line); }
.ico.idle { color: var(--muted); }
.ico.warn { background: var(--bad); color: #fff; }
.ico.now { border: 2px solid var(--accent); border-top-color: transparent; animation: spin .8s linear infinite; }
@keyframes pop { 0% { transform: scale(.3); } 70% { transform: scale(1.2); } 100% { transform: scale(1); } }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .ico, .bar i { animation: none !important; transition: none; } .copy.ok path { animation: none; stroke-dasharray: none; } }

/* Tables */
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
td > .mono, td > .chip { white-space: nowrap; }
td.ico-cell { width: 28px; padding-right: 0; }
td.grow-cell { width: 100%; }
.list td { vertical-align: middle; }
tr.click { cursor: pointer; } tr.click:hover td { background: color-mix(in srgb, var(--accent) 5%, transparent); }
tr.active td { background: var(--active); }
tr.details td { background: var(--bg); cursor: auto; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; font-size: 12.5px; } .kv > span:nth-child(odd) { color: var(--muted); }

.linkbox { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; } .linkbox .small { grid-column: 1 / -1; }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: grid; place-items: start center; padding: 40px 16px; overflow: auto; z-index: 10; }
.modal .card { width: min(640px, 100%); }
.chains { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 2px 12px; font-size: 12px; margin-top: 8px; }
</style>
</head>
